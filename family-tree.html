<div id="FamilyChart" class="f3" style="width:100%;height:900px;margin:auto;background-color:rgb(33,33,33);color:#fff;border-radius:8px;"></div>

<script src="https://unpkg.com/d3@7"></script>
<link rel="stylesheet" href="https://unpkg.com/family-chart@latest/dist/styles/family-chart.css"/>
<script type="module" src="https://unpkg.com/family-chart@latest"></script>
<script type="module">
  const data = {{ site.data.family_tree | jsonify }};

  const chart = f3.createChart('#FamilyChart', data);
  chart.setCardHtml()
    .setCardDisplay([["first name", "last name"], ["birthday"]]);
  chart.updateTree({ initial: true });
</script>
